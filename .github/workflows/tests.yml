name: tests

on:
  push:
    branches:
      - main
      - 'feat/*'
      - 'HotFix/*'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing_web
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        php-version: ['8.5']  
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql # 🌟 ADICIÓN: Extensiones necesarias para Laravel
          coverage: none 

      - name: Setup Node
        uses: actions/setup-node@v4 
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Purgar cache de Laravel
        run: |
          php artisan config:clear
          php artisan view:clear
          php artisan cache:clear
        env:
          CACHE_STORE: array
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing_web
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing_web
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Tests
        run: php artisan test 
        env:
          APP_ENV: testing
          VITE_HOT_RELOAD: "false"
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing_web
          DB_USERNAME: root
          DB_PASSWORD: ""